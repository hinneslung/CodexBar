name: Sync upstream main

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'hinneslung/CodexBar'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fast-forward mirror only
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh repo sync hinneslung/CodexBar --source steipete/CodexBar --branch main
